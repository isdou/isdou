<svg width="900" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="softShadow" x="-10" y="-10" width="920" height="270" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#7A4E20" flood-opacity="0.1" />
    </filter>
    <style>
      .rounded { font-family: -apple-system, "SF Pro Rounded", "PingFang SC", sans-serif; }
      .mono { font-family: "SF Mono", Menlo, monospace; }
