<svg width="900" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="softShadow" x="-10" y="-10" width="920" height="280" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#7A4E20" flood-opacity="0.08" />
    </filter>
    <style>
      .rounded { font-family: -apple-system, "SF Pro Rounded", "PingFang SC", "Helvetica Neue", sans-serif; }
      .mono { font-family: "SF Mono", Menlo, monospace; }
    </style>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#FFFDF8" />
      <stop offset="100%" stop-color="#FFFAF0" />
    </linearGradient>
  </defs>

  <!-- Soft warm card background (no hard pixel border) -->
  <rect x="20" y="12" width="860" height="216" rx="28" fill="url(#bgGrad)" stroke="#EFE2CC" stroke-width="1.5" filter="url(#softShadow)" />

  <!-- Window controls: soft rounded dots, no hard outline -->
  <circle cx="52" cy="40" r="7" fill="#FFB5BA" />
  <circle cx="78" cy="40" r="7" fill="#FFE180" />
  <circle cx="104" cy="40" r="7" fill="#8EC0E4" />

  <!-- Window title, softer, centered -->
  <text x="450" y="45" fill="#ADA194" font-size="13" class="mono" text-anchor="middle">dou@os ~ profile</text>

  <!-- Left side: avatar + name -->
  <!-- Cute little monitor icon in warm yellow, soft style -->
  <rect x="50" y="70" width="84" height="64" rx="16" fill="#FFEB9E" />
  <rect x="58" y="78" width="68" height="44" rx="8" fill="#FFFDF8" />
  <line x1="65" y1="88" x2="119" y2="88" stroke="#FFD24A" stroke-width="3" stroke-linecap="round" />
  <line x1="65" y1="99" x2="100" y2="99" stroke="#F6C94D" stroke-width="3" stroke-linecap="round" />
  <line x1="65" y1="110" x2="110" y2="110" stroke="#E8B840" stroke-width="3" stroke-linecap="round" />
  <rect x="78" y="134" width="28" height="10" rx="5" fill="#F6C94D" />
  <rect x="68" y="140" width="48" height="6" rx="3" fill="#FFE180" />
  <circle cx="122" cy="122" r="3" fill="#7CC98C" />

  <!-- Name & title -->
  <text x="160" y="92" fill="#403027" font-size="26" font-weight="700" class="rounded">豌豆 · isdou</text>
  <text x="160" y="115" fill="#857367" font-size="15" class="rounded">AI Product Manager &amp; Indie Developer</text>
  
  <!-- Tags, soft pill style -->
  <rect x="160" y="126" rx="10" ry="10" width="54" height="22" fill="#FFEB9E" />
  <text x="187" y="142" fill="#8B6914" font-size="11" font-weight="600" class="rounded" text-anchor="middle">INTJ-A</text>
  <rect x="222" y="126" rx="10" ry="10" width="80" height="22" fill="#FFEB9E" />
  <text x="262" y="142" fill="#8B6914" font-size="11" font-weight="600" class="rounded" text-anchor="middle">Indie Hacker</text>
  <rect x="310" y="126" rx="10" ry="10" width="64" height="22" fill="#FFEB9E" />
  <text x="342" y="142" fill="#8B6914" font-size="11" font-weight="600" class="rounded" text-anchor="middle">Beijing 🏙️</text>

  <!-- Divider line, soft warm color -->
  <line x1="400" y1="70" x2="400" y2="180" stroke="#EFE3D2" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Right side: warm status card, NO more black terminal! -->
  <rect x="430" y="68" width="430" height="118" rx="20" fill="#FFFAF0" stroke="#EFE2CC" stroke-width="1" />
  <text x="452" y="93" fill="#3C9B55" font-size="12" font-weight="600" class="mono">● online</text>
  
  <text x="452" y="118" fill="#403027" font-size="14" class="rounded">Philosophy: <tspan font-weight="600">轻软、安静、有用</tspan></text>
  <text x="452" y="140" fill="#403027" font-size="14" class="rounded">Building: <tspan font-weight="600">iOS Apps · AI Tools</tspan></text>
  <text x="452" y="162" fill="#857367" font-size="13" class="rounded">Motto: 日常有回应，生活有线索</text>

  <!-- Bottom capsule buttons, warm colors, soft shadows, no hard pixel outline -->
  <g filter="url(#softShadow)">
    <rect x="50" y="172" width="115" height="32" rx="16" fill="#FFD24A" />
    <text x="107.5" y="193" fill="#403027" font-size="13" font-weight="600" class="rounded" text-anchor="middle">🌐 isdou.info</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="175" y="172" width="115" height="32" rx="16" fill="#8EC0E4" />
    <text x="232.5" y="193" fill="#fff" font-size="13" font-weight="600" class="rounded" text-anchor="middle">📝 isdou.site</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="300" y="172" width="80" height="32" rx="16" fill="#FFB5BA" />
    <text x="340" y="193" fill="#403027" font-size="13" font-weight="600" class="rounded" text-anchor="middle">✉️ Email</text>
  </g>

</svg>
