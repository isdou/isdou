  <g filter="url(#softShadow)">
    <rect x="40" y="188" width="115" height="26" rx="13" fill="#FFD24A" />
    <text x="97.5" y="205" fill="#403027" font-size="12" font-weight="600" class="rounded" text-anchor="middle">🌐 isdou.info</text>
