  <g filter="url(#softShadow)">
    <rect x="167" y="188" width="90" height="26" rx="13" fill="#F49A9D" />
    <text x="212" y="205" fill="#403027" font-size="12" font-weight="600" class="rounded" text-anchor="middle">📮 邮箱</text>
