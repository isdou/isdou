  </defs>

  <rect x="5" y="5" width="880" height="220" rx="20" fill="#FFFEFA" stroke="#C9B8A3" stroke-width="2" filter="url(#softShadow)" />
  <line x1="5" y1="44" x2="885" y2="44" stroke="#EAD9C5" stroke-width="1.5" />
  
  <circle cx="28" cy="24" r="7" fill="#F49A9D" />
  <circle cx="52" cy="24" r="7" fill="#FFDF6E" />
  <circle cx="76" cy="24" r="7" fill="#82B6DD" />
  <text x="450" y="29" fill="#857367" font-size="13" font-weight="500" class="mono" text-anchor="middle">豌豆@DOU.OS:~ /profile</text>

  <!-- Left: wider space for text, all content LEFT of 280px divider -->
  <rect x="40" y="70" width="70" height="56" rx="10" fill="#5D4037" />
  <rect x="46" y="76" width="58" height="40" rx="5" fill="#FFEB9E" />
  <line x1="53" y1="86" x2="97" y2="86" stroke="#FFD24A" stroke-width="2.5" stroke-linecap="round" />
  <line x1="53" y1="95" x2="85" y2="95" stroke="#F6C94D" stroke-width="2.5" stroke-linecap="round" />
  <line x1="53" y1="104" x2="92" y2="104" stroke="#E8B840" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 65 116 L 85 116 L 89 124 L 61 124 Z" fill="#5D4037" />
  <circle cx="102" cy="110" r="2" fill="#7CC98C" />

  <text x="130" y="88" fill="#403027" font-size="24" font-weight="700" class="rounded">豌豆 · isdou</text>
  <text x="130" y="115" fill="#857367" font-size="16" class="rounded">AI PM</text>
  <text x="130" y="140" fill="#6B5B4F" font-size="12" class="mono">[INTJ-A] · [Indie Hacker] · [Beijing]</text>

  <!-- Divider moved FAR right, all left text ends before here -->
  <line x1="370" y1="50" x2="370" y2="215" stroke="#EFE3D2" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Right: Skills - shorter labels so they fit -->
  <text x="390" y="75" fill="#857367" font-size="11" font-weight="600" class="mono">SKILLS:</text>

  <text x="390" y="98" fill="#403027" font-size="12" font-weight="500" class="rounded">AI Product</text>
  <rect x="390" y="105" width="125" height="10" rx="5" fill="#F0E6D6" />
  <rect x="390" y="105" width="118" height="10" rx="5" fill="#FFD24A" />
  <text x="528" y="114" fill="#403027" font-size="11" font-weight="600" class="mono">95%</text>

  <text x="390" y="135" fill="#403027" font-size="12" font-weight="500" class="rounded">iOS SwiftUI</text>
  <rect x="390" y="142" width="125" height="10" rx="5" fill="#F0E6D6" />
  <rect x="390" y="142" width="110" height="10" rx="5" fill="#82B6DD" />
  <text x="528" y="151" fill="#403027" font-size="11" font-weight="600" class="mono">88%</text>

  <text x="390" y="172" fill="#403027" font-size="12" font-weight="500" class="rounded">Full-Stack</text>
  <rect x="390" y="179" width="125" height="10" rx="5" fill="#F0E6D6" />
