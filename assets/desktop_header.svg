  <text x="565" y="92" fill="#7CC98C" font-size="11" class="mono">&gt; cat douos_status.conf</text>
  <text x="565" y="112" fill="#FFFFFF" font-size="11.5" class="mono">Status: ONLINE (running)</text>
  <text x="565" y="132" fill="#FFDF6E" font-size="11.5" class="mono">Core: AI Agent Tools</text>
  <text x="565" y="152" fill="#8EC0E4" font-size="11.5" class="mono">Motto: 日常有回应，生活有线索</text>
