<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 126" width="100%" height="126" fill="none">
  <defs>
    <style>
      .mono { font-family: "SF Mono", "Space Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .doto { font-family: "SF Pro Rounded", "Doto", "SF Mono", "Space Mono", sans-serif; font-weight: 800; }
    </style>
    <clipPath id="iconClip_track2_snapshelf_dark">
      <rect x="24" y="31" width="64" height="64" rx="14" />
    </clipPath>
  </defs>

  <!-- Card Background -->
  <rect x="0.5" y="0.5" width="839" height="125" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1" />

  <!-- App Icon -->
  <g clip-path="url(#iconClip_track2_snapshelf_dark)">
    <rect x="24" y="31" width="64" height="64" fill="#1C1C1C" />
    <image href="data:image/png;base64," x="24" y="31" width="64" height="64" preserveAspectRatio="xMidYMid slice" />
  </g>
  <rect x="24" y="31" width="64" height="64" rx="14" fill="none" stroke="#30363D" stroke-width="1" />

  <!-- Line 1: Track label & Badge -->
  <text x="104" y="42" fill="#8B949E" font-size="11.5" class="mono" font-weight="600" letter-spacing="0.06em">[ TRACK 02 // MACOS ]</text>
  <rect x="276" y="29" width="144" height="19" rx="4" fill="#0D1117" stroke="#30363D" stroke-width="1" />
  <text x="348" y="42.5" fill="#C9D1D9" font-size="10" class="mono" text-anchor="middle" font-weight="500">SwiftUI 6.2 · 772KB</text>

  <!-- Line 2: Title & Subtitle (tspan prevents cross-platform overlap) -->
  <text x="104" y="72" fill="#F0F6FC" font-size="19" class="doto" letter-spacing="0.04em">SNAPSHELF<tspan dx="12" dy="-1" fill="#C9D1D9" font-size="13.5" class="sans" font-weight="500" letter-spacing="0">macOS 截图暂存架</tspan></text>

  <!-- Line 3: Description -->
  <text x="104" y="99" fill="#9CA3AF" font-size="12.5" class="sans" font-weight="400">极致轻量屏幕边缘富媒体中转站。仅 772 KB、原生 Swift、零 Electron，连续截图贴边吸附、退出即焚。</text>

  <!-- Action Button -->
  <rect x="712" y="45" width="104" height="36" rx="7" fill="#21262D" stroke="#3B434B" stroke-width="1" />
  <text x="764" y="67" fill="#F0F6FC" font-size="11" class="mono" text-anchor="middle" font-weight="700" letter-spacing="0.06em">GET APP ↗</text>
</svg>
