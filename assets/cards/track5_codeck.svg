  </defs>

  <!-- Card Background -->
  <rect x="0.5" y="0.5" width="839" height="125" rx="14" fill="#FAFAFA" stroke="#E4E4E7" stroke-width="1" />

  <!-- App Icon -->
  <rect x="24" y="31" width="64" height="64" rx="14" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1" />
  <g transform="translate(24, 31) scale(0.64)">
    <path d="M 24 34 L 36 43 L 24 52" stroke="#18181B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="42" y1="52" x2="60" y2="52" stroke="#71717A" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="30" cy="72" r="4.5" fill="#18181B" />
    <circle cx="50" cy="72" r="4.5" fill="#71717A" />
    <circle cx="70" cy="72" r="4.5" fill="#A1A1AA" />
    <line x1="35" y1="72" x2="45" y2="72" stroke="#D4D4D8" stroke-width="2" stroke-dasharray="2.5 2.5" />
    <line x1="55" y1="72" x2="65" y2="72" stroke="#D4D4D8" stroke-width="2" stroke-dasharray="2.5 2.5" />
    <path d="M 12 20 L 12 12 L 20 12" stroke="#D4D4D8" stroke-width="2" stroke-linecap="round" />
    <path d="M 80 12 L 88 12 L 88 20" stroke="#D4D4D8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Line 1: Track label & Badge -->
  <text x="104" y="42" fill="#71717A" font-size="11.5" class="mono" font-weight="600" letter-spacing="0.06em">[ TRACK 05 // MCP ]</text>
  <rect x="262" y="29" width="96" height="19" rx="4" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1" />
  <text x="310" y="42.5" fill="#3F3F46" font-size="10" class="mono" text-anchor="middle" font-weight="500">MCP &amp; Skill</text>

  <!-- Line 2: Title & Subtitle (tspan prevents cross-platform overlap) -->
  <text x="104" y="72" fill="#0A0A0A" font-size="19" class="doto" letter-spacing="0.04em">CODECK<tspan dx="12" dy="-1" fill="#3F3F46" font-size="13.5" class="sans" font-weight="500" letter-spacing="0">Codex 多模型协作插件</tspan></text>

  <!-- Line 3: Description -->
  <text x="104" y="99" fill="#52525B" font-size="12.5" class="sans" font-weight="400">留在 Codex 主工作台，按需点名调度 Gemini / Claude / Kimi 各自最擅长的能力并带回结果，不切窗口、不丢上下文。</text>

  <!-- Action Button -->
