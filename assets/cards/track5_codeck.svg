<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 126" width="100%" height="126" fill="none">
  <defs>
    <style>
      .mono { font-family: "SF Mono", "Space Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .doto { font-family: "SF Pro Rounded", "Doto", "SF Mono", "Space Mono", sans-serif; font-weight: 800; }
    </style>
    <clipPath id="iconClip_track5_codeck_light">
      <rect x="24" y="31" width="64" height="64" rx="14" />
