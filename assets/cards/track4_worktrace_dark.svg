<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 126" width="100%" height="126" fill="none">
  <defs>
    <style>
      .mono { font-family: "SF Mono", "Space Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .doto { font-family: "SF Pro Rounded", "Doto", "SF Mono", "Space Mono", sans-serif; font-weight: 800; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="0.5" y="0.5" width="839" height="125" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1" />

  <!-- Official Worktrace W-Trace Icon -->
  <g transform="translate(24, 31) scale(1.6)">
    <rect x="0.75" y="0.75" width="38.5" height="38.5" rx="9" fill="#171717" stroke="#484F58" stroke-width="1" />
    <path d="M9.25 11.5 14.1 28.8 20 16.9l5.9 11.9 4.85-17.3" stroke="#FAFAFA" stroke-width="2.55" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="9.25" cy="11.5" r="2.15" fill="#FAFAFA" />
    <circle cx="30.75" cy="11.5" r="2.15" fill="#FAFAFA" />
  </g>

  <!-- Line 1: Track label & Badge -->
  <text x="104" y="42" fill="#8B949E" font-size="11.5" class="mono" font-weight="600" letter-spacing="0.06em">[ TRACK 04 // PLUGIN ]</text>
  <rect x="284" y="29" width="96" height="19" rx="4" fill="#0D1117" stroke="#30363D" stroke-width="1" />
  <text x="332" y="42.5" fill="#C9D1D9" font-size="10" class="mono" text-anchor="middle" font-weight="500">Local-First</text>

  <!-- Line 2: Title & Subtitle -->
  <text x="104" y="72" fill="#F0F6FC" font-size="19" class="doto" letter-spacing="0.04em">WORKTRACE<tspan dx="12" dy="-1" fill="#C9D1D9" font-size="13.5" class="sans" font-weight="500" letter-spacing="0">本机职业证据工作台</tspan></text>

  <!-- Line 3: Description -->
  <text x="104" y="99" fill="#9CA3AF" font-size="12.5" class="sans" font-weight="400">本机优先的 DeepSeek Harness 插件。用黑白画布整理经历证据、对照岗位并导出版本化简历，资料不离本机。</text>

  <!-- Action Button -->
  <rect x="712" y="45" width="104" height="36" rx="7" fill="#21262D" stroke="#3B434B" stroke-width="1" />
  <text x="764" y="67" fill="#F0F6FC" font-size="11" class="mono" text-anchor="middle" font-weight="700" letter-spacing="0.06em">VIEW REPO ↗</text>
</svg>
