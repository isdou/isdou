  <text x="104" y="72" fill="#F0F6FC" font-size="19" class="doto" letter-spacing="0.04em">WORKTRACE<tspan dx="12" dy="-1" fill="#C9D1D9" font-size="13.5" class="sans" font-weight="500" letter-spacing="0">职业证据工作台</tspan></text>

