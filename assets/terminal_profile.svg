<svg width="900" height="440" viewBox="0 0 900 440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="termShadow" x="-10" y="-10" width="920" height="470" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#7A4E20" flood-opacity="0.12" />
    </filter>
    <style>
      .mono { font-family: "SF Mono", Menlo, Monaco, "Courier New", monospace; }
    </style>
  </defs>

  <!-- Window -->
  <rect x="5" y="5" width="890" height="430" rx="16" fill="#3E2C22" stroke="#5D4037" stroke-width="2" filter="url(#termShadow)" />
  <line x1="5" y1="46" x2="895" y2="46" stroke="#5D4037" stroke-width="1.5" />

  <!-- Traffic lights -->
  <circle cx="30" cy="25" r="7" fill="#F49A9D" />
  <circle cx="54" cy="25" r="7" fill="#FFDF6E" />
  <circle cx="78" cy="25" r="7" fill="#82B6DD" />
  <text x="450" y="30" fill="#A8998C" font-size="13" font-weight="500" class="mono" text-anchor="middle">豌豆@DOU.OS: ~ — zsh</text>

  <!-- Session -->
  <g font-size="14" class="mono" xml:space="preserve">

    <!-- whoami -->
    <text x="40" y="86"><tspan fill="#FFDF6E">豌豆@DOU.OS</tspan><tspan fill="#8EC0E4"> ~ </tspan><tspan fill="#7CC98C">% </tspan><tspan fill="#FFFFFF">whoami</tspan></text>
    <text x="40" y="114" fill="#E8DCC8">豌豆 (isdou) · AI 产品经理 · 独立开发者 · INTJ-A · Beijing</text>

    <!-- motto -->
    <text x="40" y="152"><tspan fill="#FFDF6E">豌豆@DOU.OS</tspan><tspan fill="#8EC0E4"> ~ </tspan><tspan fill="#7CC98C">% </tspan><tspan fill="#FFFFFF">cat motto.txt</tspan></text>
    <text x="40" y="180"><tspan fill="#FFD24A">📦 Perspexi, concepi, creavi.</tspan><tspan fill="#A8998C"> — 洞察，构想，创造。</tspan></text>

    <!-- apps -->
    <text x="40" y="218"><tspan fill="#FFDF6E">豌豆@DOU.OS</tspan><tspan fill="#8EC0E4"> ~ </tspan><tspan fill="#7CC98C">% </tspan><tspan fill="#FFFFFF">ls -G ~/apps</tspan></text>
    <text x="40" y="246" font-weight="600"><tspan fill="#8EC0E4">Lifelogs/</tspan><tspan fill="#E8DCC8">   </tspan><tspan fill="#8EC0E4">TodoVoice/</tspan><tspan fill="#E8DCC8">   </tspan><tspan fill="#8EC0E4">GitKeep/</tspan><tspan fill="#E8DCC8">   </tspan><tspan fill="#8EC0E4">JoyCon-Vibe/</tspan><tspan fill="#E8DCC8">   </tspan><tspan fill="#8EC0E4">1Key/</tspan><tspan fill="#E8DCC8">   </tspan><tspan fill="#8EC0E4">XiaoDou-AI/</tspan><tspan fill="#F49A9D"> (wip)</tspan></text>

    <!-- oss -->
    <text x="40" y="284"><tspan fill="#FFDF6E">豌豆@DOU.OS</tspan><tspan fill="#8EC0E4"> ~ </tspan><tspan fill="#7CC98C">% </tspan><tspan fill="#FFFFFF">ls -G ~/oss</tspan></text>
    <text x="40" y="312" font-weight="600"><tspan fill="#8EC0E4">codeck/</tspan><tspan fill="#E8DCC8">   </tspan><tspan fill="#8EC0E4">MosaicPath/</tspan><tspan fill="#E8DCC8">   </tspan><tspan fill="#8EC0E4">xiaodou-skill/</tspan><tspan fill="#E8DCC8">   </tspan><tspan fill="#8EC0E4">aoleme-ui-skill/</tspan></text>

    <!-- contact -->
    <text x="40" y="350"><tspan fill="#FFDF6E">豌豆@DOU.OS</tspan><tspan fill="#8EC0E4"> ~ </tspan><tspan fill="#7CC98C">% </tspan><tspan fill="#FFFFFF">./contact.sh</tspan></text>
    <text x="40" y="378"><tspan fill="#E8DCC8">🌐 isdou.info</tspan><tspan fill="#5D4037">   |   </tspan><tspan fill="#E8DCC8">𝕏 @dou_dev</tspan><tspan fill="#5D4037">   |   </tspan><tspan fill="#E8DCC8">🐙 github.com/isdou</tspan></text>

    <!-- idle prompt + blinking cursor -->
    <text x="40" y="416"><tspan fill="#FFDF6E">豌豆@DOU.OS</tspan><tspan fill="#8EC0E4"> ~ </tspan><tspan fill="#7CC98C">% </tspan></text>
    <rect x="195" y="404" width="9" height="17" fill="#7CC98C">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
